name: Build PanelDue Firmware

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Compiler & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build build-essential

      - name: Configure and Build Firmware
        run: |
          rm -rf build
          # Géén env.cmake gebruiken hier, vertrouw op de standaard compiler!
          cmake -B build -DDEVICE="v3-4.3" .
          make -C build VERBOSE=1 all

      - name: Append Custom Splash Screen
        run: |
          # Dit voegt jouw 54KB logo samen met de correcte 149KB firmware
          cat build/paneldue.bin SplashScreens/SplashScreen-Duet3D-480x272.bin > build/PanelDueFirmware.bin

      - name: Upload Binary Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PanelDueFirmware-Binaries
          path: |
            build/PanelDueFirmware.bin
