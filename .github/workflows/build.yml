name: Build PanelDue Firmware

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Compiler & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Configure and Build Firmware
        run: |
          cmake -B build -DDEVICE="v3-4.3" .
          make -C build all

      - name: Upload Binary Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PanelDueFirmware-Binaries
          path: |
            build/*.bin
            **/*.bin
